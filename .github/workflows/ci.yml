name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: pharmacy, POSTGRES_PASSWORD: pharmacy, POSTGRES_DB: pharmacy_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pharmacy" --health-interval 5s --health-timeout 5s --health-retries 10
    env: {DATABASE_URL: postgresql://pharmacy:pharmacy@127.0.0.1:5432/pharmacy_test, AUTH_FINGERPRINT_SECRET: ci-secret-at-least-32-characters}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.34.6}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --import tsx src/db/migrate.ts
      - run: pnpm check
      - run: pnpm playwright test tests/e2e/acceptance.spec.ts
