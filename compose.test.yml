services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pharmacy_test
      POSTGRES_USER: pharmacy_test
      POSTGRES_PASSWORD: pharmacy_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy_test -d pharmacy_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pharmacy_test_pg18_data:/var/lib/postgresql

volumes:
  pharmacy_test_pg18_data:
