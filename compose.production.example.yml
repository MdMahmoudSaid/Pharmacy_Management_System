services:
  app:
    build: .
    restart: unless-stopped
    environment: {DATABASE_URL: "${DATABASE_URL}", AUTH_FINGERPRINT_SECRET: "${AUTH_FINGERPRINT_SECRET}"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"], interval: 30s, timeout: 5s, retries: 5}
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment: {POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}"}
    volumes: ["pharmacy_data:/var/lib/postgresql"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
volumes: {pharmacy_data: {}}
